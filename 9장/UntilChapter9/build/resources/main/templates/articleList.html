<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Article List</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ecf0f1;
            padding: 2rem;
        }
        .article {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
            max-width: 700px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        p {
            color: #555;
        }
        a {
            display: inline-block;
            margin-top: 1rem;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }

        /* 👇 Styled Create Button */
        .create-btn {
            background-color: #2ecc71;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: background-color 0.3s ease;
        }

        .create-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<!-- 👇 Styled button with correct Thymeleaf usage -->
<button class="create-btn" th:onclick="|location.href='/articles/new'|">Create Blog</button>

<div th:each="article : ${articles}" class="article">
    <h1 th:text="${article.title}"></h1>
    <p th:text="${article.content}"></p>
    <a th:href="@{/articles/{id}(id=${article.id})}">Show Blog</a>
</div>
<button type="button" onclick="location.href='/logout'">로그아웃</button>
<script src="/js/test.js"></script>
</body>
</html>
